name: Build Portmaster Wine SquashFS

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for GH CLI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Download latest wine-tkg artifact
        run: |
          REPO="Frogging-Family/wine-tkg-git" 
          WORKFLOW_NAME="Wine Ubuntu CI" 

          echo "Finding latest successful run for workflow..."
          RUN_ID=$(gh run list --repo "$REPO" --workflow "$WORKFLOW_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          
          if [ -z "$RUN_ID" ]; then
            echo "No successful workflow runs found."
            exit 1
          fi
          echo "Found Run ID: $RUN_ID"

          # By omitting --name, gh run download pulls all artifacts from the run
          # into separate subfolders inside ./wine-zip
          echo "Downloading all artifacts for Run $RUN_ID..."
          gh run download "$RUN_ID" --repo "$REPO" --dir ./wine-zip

      - name: Structure Portmaster Wine runtime
        run: |
          # Create target directory for SquashFS
          mkdir -p runtime_root
          
          # Find the .tar archive anywhere inside the downloaded artifact folders
          TAR_FILE=$(find ./wine-zip -name "*.tar*" -print -quit)
          
          if [ -z "$TAR_FILE" ]; then
            echo "No tar archive found inside the downloaded artifact."
            exit 1
          fi
          echo "Extracting archive: $TAR_FILE"
          
          # Extract tar directly into runtime_root
          tar -xf "$TAR_FILE" -C runtime_root --strip-components=1 || tar -xf "$TAR_FILE" -C runtime_root
          
          # Ensure execution permissions for the main binary
          if [ -f "runtime_root/bin/wine" ]; then
            chmod +x runtime_root/bin/wine
          else
            echo "Warning: runtime_root/bin/wine not found. Check internal paths."
          fi

      - name: Build SquashFS profile
        run: |
          # Compress into SquashFS format using xz compression
          mksquashfs runtime_root/ wine-tkg-runtime.squashfs -comp xz

      - name: Upload Portmaster Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-tkg-portmaster-runtime
          path: wine-tkg-runtime.squashfs
